# Sitio de NutriVida para nginx (se copia a /etc/nginx/conf.d/default.conf dentro de la imagen).
# - Sirve la aplicación React (SPA): cualquier ruta desconocida devuelve index.html.
# - Reenvía la API y Swagger al API Gateway, que está en la red interna de Docker.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. El nombre del gateway se resuelve en cada petición (no solo al arrancar):
    # así nginx inicia aunque el gateway todavía no exista y sigue funcionando si el contenedor
    # del gateway se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    # Datos que se reenvían al gateway. $http_host conserva también el puerto (por ejemplo
    # localhost:8000), para que el gateway vea la misma dirección que el navegador: lo necesitan
    # la validación de CORS y las redirecciones de Swagger.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Respuestas comprimidas (JavaScript, CSS y JSON de la API).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API REST
    location /api/ {
        proxy_pass $gateway;
    }

    # Swagger unificado del gateway
    location = /swagger-ui.html { proxy_pass $gateway; }
    location /swagger-ui/        { proxy_pass $gateway; }
    location /webjars/           { proxy_pass $gateway; }
    location /v3/api-docs        { proxy_pass $gateway; }
    location ~ ^/(identidad|catalogo|ordenes|citas|clinico)/v3/api-docs$ {
        proxy_pass $gateway;
    }

    # Archivos de la compilación (con hash en el nombre): se pueden guardar en caché.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se guarda en caché, para que cada nuevo despliegue se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas de React Router (por ejemplo /mis-citas o /admin/usuarios)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
